
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>NILTSI | Independent Aviation Project</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(
        ellipse at center,
        #14293a 0%,
        #101f2c 50%,
        #0b1721 100%
      );
      color: #f4f6f8;
      font-family: "Arial Narrow",
                   "Liberation Sans Narrow",
                   Arial, sans-serif;
      font-stretch: condensed;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1300px;
      padding: 40px 24px;
      text-align: center;
    }

    h1 {
      font-size: clamp(64px, 8vw, 100px);
      font-weight: 700;
      letter-spacing: 0.07em;
      margin: 0 0 65px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: #536e80;
      opacity: 0.8;
      margin-bottom: 75px;
    }

    h2 {
      font-size: clamp(22px, 3.5vw, 48px);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.3;
      margin: 0 0 65px;
    }

    .status {
      color: #91aec2;
      font-size: clamp(14px, 2vw, 24px);
      letter-spacing: 0.14em;
      font-weight: 400;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        margin-bottom: 40px;
      }

      .divider {
        margin-bottom: 45px;
      }

      h2 {
        margin-bottom: 45px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>NILTSI</h1>

    <div class="divider"></div>

    <h2>INDEPENDENT AVIATION PROJECT</h2>

    <div class="status">
      WORK IN PROGRESS &middot; COMING SOON
    </div>

  </main>
</body>
</html>
